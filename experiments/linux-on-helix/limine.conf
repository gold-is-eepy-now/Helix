# Limine configuration for the Linux-on-Helix experiment.
#
# Limine loads a Linux bzImage with the Linux boot protocol, the same way it
# loads Helix's own kernel. `module_path` passes the initramfs to Linux.

timeout: 0

# Mirror Limine's own log to the serial port, so a headless run shows the boot.
serial: yes

/Linux on Helix
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.cpio
    # earlycon writes from the first instructions, before the console driver is up.
    cmdline: earlycon=uart8250,io,0x3f8 console=ttyS0 panic=-1
