# Limine bootloader configuration for Helix OS.
#
# Limine looks for this file (as limine.conf) in a few well-known places on
# the boot partition; we install it at /boot/limine/limine.conf.
#
# `boot():` means "the partition this configuration was loaded from", so the
# paths stay valid no matter which disk the image ends up on.

# Seconds to wait on the boot menu before booting the default entry.
timeout: 3

/Helix OS
    protocol: limine
    path: boot():/boot/kernel
